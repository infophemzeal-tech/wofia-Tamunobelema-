<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4e8">
  <meta name="description" content="You are specially invited to the wedding of Wofai and Tamunobelema, December 30, 2026, at Marina Resort, Calabar.">
  <title>Wofai & Tamunobelema — You are specially invited</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Great+Vibes&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="prefetch" href="invitation.html">
  <style>
    /* Splash screen */
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f4e8; }
    .splash { display: flex; }
    .splash {
      position: fixed;
      inset: 0;
      z-index: 200;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: #f7f4e8;
      color: #696b50;
      overflow: hidden;
      transition: transform 1.1s cubic-bezier(.77, 0, .18, 1), opacity .9s ease .2s;
    }
    .splash::before {              /* soft glow behind the names */
      content: "";
      position: absolute;
      width: min(120vw, 640px);
      aspect-ratio: 1;
      top: 50%; left: 50%;
      transform: translate(-50%, -54%);
      background: radial-gradient(circle, rgba(105, 107, 80, .14), rgba(105, 107, 80, 0) 65%);
      animation: splash-breathe 6s ease-in-out infinite;
    }
    .splash-sprig {
      position: absolute;
      width: 90px;
      color: #696b50;
      opacity: 0;
      animation: splash-fade 1.6s ease .3s forwards;
    }
    .splash-sprig-a { top: 6%; left: 8%; }
    .splash-sprig-b { bottom: 6%; right: 8%; transform: rotate(180deg); }
    .splash-names {
      position: relative;
      margin: 0;
      font-family: "Great Vibes", cursive;
      font-weight: 400;
      font-size: clamp(2.6rem, 11vw, 4.6rem);
      line-height: 1.15;
      color: #3f402e;
    }
    .splash-names span { display: block; opacity: 0; animation: splash-rise 1.2s cubic-bezier(.2, .7, .2, 1) forwards; }
    .splash-names .n1 { animation-delay: .4s; }
    .splash-names .amp { color: #a9a07f; font-size: .7em; line-height: 1; animation-delay: .8s; }
    .splash-names .n2 { animation-delay: 1.2s; }
    .splash-rule {
      position: relative;
      width: 0;
      height: 1px;
      margin: 1.75rem auto 1.5rem;
      background: #a9a07f;
      animation: splash-line 1.2s ease 1.7s forwards;
    }
    .splash-invited {
      position: relative;
      margin: 0 0 2.5rem;
      font-family: "Manrope", sans-serif;
      font-size: .78rem;
      letter-spacing: .38em;
      text-transform: uppercase;
      opacity: 0;
      animation: splash-rise 1s ease 2s forwards;
    }
    .splash-open {
      position: relative;
      overflow: hidden;
      font-family: "Manrope", sans-serif;
      font-weight: 500;
      font-size: .78rem;
      letter-spacing: .3em;
      text-transform: uppercase;
      color: #fff;
      background: #696b50;
      border: 0;
      border-radius: 999px;
      padding: 1.15rem 2.6rem;
      cursor: pointer;
      box-shadow: 0 12px 28px rgba(105, 107, 80, .35);
      opacity: 0;
      animation: splash-rise 1s ease 2.4s forwards, splash-pulse 2.6s ease-in-out 3.6s infinite;
      transition: transform .25s ease, box-shadow .25s ease;
    }
    .splash-open::after {          /* shimmer sweep */
      content: "";
      position: absolute;
      top: 0; bottom: 0;
      width: 40%;
      left: -60%;
      background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent);
      transform: skewX(-20deg);
      animation: splash-shimmer 3.2s ease-in-out 3.2s infinite;
    }
    .splash-open:hover, .splash-open:focus-visible { transform: translateY(-2px) scale(1.04); box-shadow: 0 16px 34px rgba(105, 107, 80, .45); }
    .splash-open:active { transform: scale(.97); }
    .splash-open .arrow { display: inline-block; margin-left: .5rem; transition: transform .25s; }
    .splash-open:hover .arrow { transform: translate(3px, -3px); }

    /* Opening: names drift up and fade, the whole screen lifts away */
    .splash.is-opening { opacity: 0; pointer-events: none; transition: opacity .9s ease .25s; }
    .splash.is-opening .splash-names,
    .splash.is-opening .splash-rule,
    .splash.is-opening .splash-invited,
    .splash.is-opening .splash-open { transition: transform .9s ease, opacity .6s ease; transform: translateY(-24px) scale(1.04); opacity: 0; }

    @keyframes splash-rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
    @keyframes splash-fade { to { opacity: .22; } }
    @keyframes splash-line { to { width: 72px; } }
    @keyframes splash-breathe { 0%, 100% { transform: translate(-50%, -54%) scale(1); } 50% { transform: translate(-50%, -54%) scale(1.08); } }
    @keyframes splash-pulse {
      0%, 100% { box-shadow: 0 12px 28px rgba(105, 107, 80, .35), 0 0 0 0 rgba(105, 107, 80, .35); }
      50% { box-shadow: 0 12px 28px rgba(105, 107, 80, .35), 0 0 0 14px rgba(105, 107, 80, 0); }
    }
    @keyframes splash-shimmer { 0% { left: -60%; } 55%, 100% { left: 130%; } }
    @media (prefers-reduced-motion: reduce) {
      .splash, .splash * { animation-duration: .01s !important; animation-delay: 0s !important; transition-duration: .3s !important; }
    }
  </style>
  <script>
    /* Old links like index.html#rsvp go straight to the invitation */
    if (location.hash) location.replace("invitation.html" + location.hash);
  </script>
</head>

<body>
  <div class="splash" id="splash" role="dialog" aria-modal="true" aria-label="Wedding invitation welcome">
    <svg class="splash-sprig splash-sprig-a" viewBox="0 0 120 260" fill="none" aria-hidden="true"><path d="M14 255C48 202 29 158 67 113 91 83 96 43 104 7M50 144C25 134 21 113 25 98c21 6 30 21 25 46ZM70 111c-3-23 7-40 24-46 6 20-3 37-24 46ZM35 194c-20-1-31-15-32-30 19 0 33 11 32 30ZM88 73c-1-22 10-35 24-39 2 18-7 32-24 39ZM21 226c-14-1-22-10-21-22 13 2 22 9 21 22Z" stroke="currentColor" stroke-width="1.2"/></svg>
    <svg class="splash-sprig splash-sprig-b" viewBox="0 0 120 260" fill="none" aria-hidden="true"><path d="M14 255C48 202 29 158 67 113 91 83 96 43 104 7M50 144C25 134 21 113 25 98c21 6 30 21 25 46ZM70 111c-3-23 7-40 24-46 6 20-3 37-24 46ZM35 194c-20-1-31-15-32-30 19 0 33 11 32 30ZM88 73c-1-22 10-35 24-39 2 18-7 32-24 39ZM21 226c-14-1-22-10-21-22 13 2 22 9 21 22Z" stroke="currentColor" stroke-width="1.2"/></svg>
    <h2 class="splash-names"><span class="n1">Wofai</span><span class="amp">&amp;</span><span class="n2">Tamunobelema</span></h2>
    <div class="splash-rule" aria-hidden="true"></div>
    <p class="splash-invited">You are specially invited</p>
    <button class="splash-open" id="splash-open" type="button">Open invitation <span class="arrow" aria-hidden="true">↗</span></button>
  </div>

  <script>
    (function () {
      var splash = document.getElementById("splash");
      var btn = document.getElementById("splash-open");
      var TARGET = "invitation.html";
      var go = false;
      setTimeout(function () { btn.focus({ preventScroll: true }); }, 2600);

      btn.addEventListener("click", function () {
        if (go) return;
        go = true;
        splash.classList.add("is-opening");
        setTimeout(function () { window.location.href = TARGET; }, 1000);
      });

      /* Back button: show the welcome screen again instead of a blank page */
      window.addEventListener("pageshow", function (e) {
        if (e.persisted) { go = false; splash.classList.remove("is-opening"); }
      });
    })();
  </script>
</body>

</html>
